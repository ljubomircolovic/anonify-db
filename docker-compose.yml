version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15
    container_name: anonify_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: anonify_db
    ports:
      - "5433:5432"
    volumes:
      # Putanja potvrdjena sa slike tvoje strukture foldera
      - ./docker/db/init/01_adventureworks.sql:/docker-entrypoint-initdb.d/01_adventureworks.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d anonify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Streamlit Web UI
  ui:
    build: .
    container_name: anonify_ui
    command: streamlit run app_ui.py --server.port=8501 --server.address=0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=anonify_db
      - DB_USER=user
      - DB_PASS=password
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
    depends_on:
      db:
        condition: service_healthy
    # Crucial for local AI (Ollama) connectivity
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data: